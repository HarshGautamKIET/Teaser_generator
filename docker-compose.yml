# Full stack: self-hosted Supabase plus this application.
#
#   docker compose up -d --build
#
# The project name is pinned to `teaser-supabase` deliberately. Compose
# otherwise derives it from the directory name, which on a host running more
# than one self-hosted Supabase would collide on the shared `db-config` and
# `deno-cache` volumes and mount another deployment's Postgres config. It also
# has to match the name docker/supabase was first brought up under, or the
# database volume is not the one that was initialised.
name: teaser-supabase

# The Supabase stack is vendored unmodified from self-hosted/v0.8.0 and pulled
# in rather than copied, so `docker/supabase/update.sh` keeps working. Its
# variables come from its own .env, which is generated by utils/*.sh and is not
# committed.
include:
  - path: docker/supabase/docker-compose.yml
    env_file: docker/supabase/.env

services:
  # --- Container name overrides for the vendored Supabase services ---
  #
  # docker/supabase/docker-compose.yml hardcodes container_name: supabase-db,
  # supabase-auth, and so on. Container names are GLOBAL to the docker host, not
  # scoped to a compose project, so those defaults collide with any other
  # self-hosted Supabase on the same machine -- whichever starts second fails
  # with "name is already in use", and it is easy to misread that as this stack
  # having damaged the other one.
  #
  # Every service is renamed under a teaser- prefix so this deployment can never
  # contend with another. Overrides only; all other config comes from the
  # included file.
  studio:     { container_name: teaser-supabase-studio }
  api-gw:     { container_name: teaser-supabase-envoy }
  auth:       { container_name: teaser-supabase-auth }
  rest:       { container_name: teaser-supabase-rest }
  realtime:   { container_name: teaser-supabase-realtime }
  storage:    { container_name: teaser-supabase-storage }
  imgproxy:   { container_name: teaser-supabase-imgproxy }
  meta:       { container_name: teaser-supabase-meta }
  functions:  { container_name: teaser-supabase-edge-functions }
  db:         { container_name: teaser-supabase-db }
  supavisor:  { container_name: teaser-supabase-pooler }

  # Applies backend/migrations/*.sql, then exits. Runs before the backend so the
  # app schema, RLS policies, and the teaser_app login role all exist. Both
  # files are idempotent, so re-running on every `up` is safe.
  migrate:
    image: supabase/postgres:17.6.1.136
    container_name: teaser-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        # Applied in filename order. app_password is passed to every file even
        # though only 0002 reads it -- psql ignores unused -v variables, and
        # that beats maintaining a per-file argument list here.
        for f in /migrations/*.sql; do
          echo "applying $$(basename "$$f")"
          psql -v ON_ERROR_STOP=1 -q -v app_password="$$APP_DB_PASSWORD" -f "$$f"
        done
        echo "migrations applied"
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: teaser-backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # teaser_app, never postgres: postgres carries BYPASSRLS.
      DATABASE_URL: postgresql+psycopg://teaser_app:${APP_DB_PASSWORD:?}@db:5432/postgres
      # Service name, not localhost -- this resolves inside the compose network.
      SUPABASE_URL: http://api-gw:8000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Optional pool, rotated when a key hits its quota. Passed through
      # explicitly: settings inside the container come from this block, not
      # from the repository .env, which is not copied into the image.
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      TEASER_ASPECT_RATIO: ${TEASER_ASPECT_RATIO:-16:9}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      # Must include the port the frontend is actually published on
      # (FRONTEND_PORT, 3001 by default) as well as the Vite dev server. A
      # mismatch here fails only on the first API call from the browser -- login
      # still works, because that talks to Supabase directly, not to this API.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3001},http://localhost:5173}
      UPLOAD_DIR: /data/uploads
      GENERATED_DIR: /data/generated
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Source video and generated clips outlive the container.
      - teaser-media:/data
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    restart: unless-stopped

  frontend:
    build:
      # Repository root: the build needs design-system/ as well as frontend/.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Browser-facing URLs, so these are host addresses, not service names.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-http://localhost:8000}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?copy SUPABASE_PUBLISHABLE_KEY from docker/supabase/.env}
    container_name: teaser-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    restart: unless-stopped

volumes:
  teaser-media:
