<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Oripio — Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{height:100%}body{background:var(--surface-page);padding:14px;min-width:1240px}#root{height:calc(100vh - 28px);min-height:760px;position:relative}</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="AppShell.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="TransactionsScreen.jsx"></script>
<script type="text/babel" src="SendMoneySheet.jsx"></script>
<script type="text/babel">
const { Card, CardHeader, Button, Icon, StatusPill } = window.OripioDesignSystem_c89f4b;

const WALLETS = [
  { code:'USD', amount:'$22,678.00', status:'active' },
  { code:'EUR', amount:'€18,345.00', status:'active' },
  { code:'BDT', amount:'৳1,22,678.00', status:'active' },
  { code:'GBP', amount:'£15,000.00', status:'inactive' }
];
const GOALS = [
  { title:'Investment Goal', current:'$15,600', target:'$25,000', percent:62, icon:'target' },
  { title:'Emergency Fund', current:'$4,200', target:'$10,000', percent:42, icon:'umbrella', tone:'amber' },
  { title:'New Apartment', current:'$32,000', target:'$80,000', percent:40, icon:'house' }
];
const TXNS = [
  { name:'Mobile App Purchase', date:'Wed, 12 Jun 2026', price:'$806.50', status:'success', icon:'smartphone' },
  { name:'Software License', date:'Tue, 11 Jun 2026', price:'$102.99', status:'success', icon:'file-text' },
  { name:'Grocery Purchase', date:'Sun, 09 Jun 2026', price:'$2,500.00', status:'success', icon:'shopping-basket' },
  { name:'Cloud Storage Renewal', date:'Fri, 07 Jun 2026', price:'$48.00', status:'pending', icon:'cloud' },
  { name:'Airline Booking', date:'Thu, 06 Jun 2026', price:'$1,240.75', status:'failed', icon:'plane' }
];

function Placeholder({ title }) {
  return (
    <Card>
      <CardHeader icon={<Icon name="layers" size={15} />} title={title} />
      <p style={{fontSize:'var(--text-sm)', color:'var(--text-body)', maxWidth:520}}>
        This view is intentionally blank. The source material for this design system is a single dashboard
        render, so no layout for <strong style={{color:'var(--text-heading)'}}>{title}</strong> exists yet —
        rather than invent one, the kit leaves it empty. Ask the Oripio team for the screen and it can be added.
      </p>
    </Card>
  );
}

function App() {
  const [route, setRoute] = React.useState('dashboard');
  const [sheet, setSheet] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [txns, setTxns] = React.useState(TXNS);

  const send = (amount, code) => {
    setSheet(false);
    setTxns([{ name:'Transfer to Rafiul Karim', date:'Sun, 12 Jun 2026', price:'$' + amount, status:'success', icon:'upload', method:code + ' wallet' }, ...txns]);
    setToast('$' + amount + ' sent to Rafiul Karim');
    setTimeout(() => setToast(null), 2800);
  };

  return (
    <AppShell route={route} onRoute={setRoute}>
      {route === 'dashboard' ? (
        <>
          <PageHead title="Welcome back Sajibur Rahman"
            subtitle="Monitor and control what happens with your money today for financial health."
            actions={<>
              <Button variant="outline" icon={<Icon name="calendar" size={14} />}>Sun, 12 June 2026</Button>
              <Button variant="dark" icon={<Icon name="download" size={14} />}>Export</Button>
            </>} />
          <DashboardScreen wallets={WALLETS} goals={GOALS} transactions={txns.slice(0,3)}
            onSend={() => setSheet(true)} onRequest={() => setSheet(true)} />
        </>
      ) : route === 'transactions' ? (
        <>
          <PageHead title="Transactions" subtitle="Every movement across your Oripio wallets."
            actions={<Button variant="primary" icon={<Icon name="upload" size={14} />} onClick={() => setSheet(true)}>Send Money</Button>} />
          <TransactionsScreen transactions={txns} />
        </>
      ) : (
        <>
          <PageHead title={route.charAt(0).toUpperCase() + route.slice(1)} subtitle="Not present in the source material." />
          <Placeholder title={route.charAt(0).toUpperCase() + route.slice(1)} />
        </>
      )}
      <SendMoneySheet open={sheet} onClose={() => setSheet(false)} onSent={send} wallets={WALLETS} />
      {toast ? (
        <div style={{
          position:'absolute', bottom:22, left:'50%', transform:'translateX(-50%)', zIndex:60,
          background:'var(--surface-dark)', color:'var(--white)', borderRadius:'var(--radius-pill)',
          padding:'10px 18px', fontSize:'var(--text-sm)', fontWeight:'var(--weight-semibold)',
          boxShadow:'var(--shadow-overlay)', display:'flex', alignItems:'center', gap:8
        }}>
          <span style={{width:8, height:8, borderRadius:99, background:'var(--green-400)'}} />{toast}
        </div>
      ) : null}
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
