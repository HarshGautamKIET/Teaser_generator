<!-- @dsCard group="Colors" viewport="700x150" name="Surface & text aliases" subtitle="Reach for these, not the raw ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--white);padding:18px;font-family:var(--font-sans)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font-size:11px">
<div style="background:var(--surface-page);border-radius:var(--radius-md);padding:12px;box-shadow:var(--inset-hairline)"><div style="font-weight:700;color:var(--text-heading)">--surface-page</div><div style="color:var(--text-body)">the desk behind the shell</div></div>
<div style="background:var(--surface-card);border-radius:var(--radius-md);padding:12px;box-shadow:var(--inset-hairline)"><div style="font-weight:700;color:var(--text-heading)">--surface-card</div><div style="color:var(--text-body)">every dashboard module</div></div>
<div style="background:var(--surface-tile);border-radius:var(--radius-md);padding:12px;box-shadow:var(--inset-hairline)"><div style="font-weight:700;color:var(--text-heading)">--surface-tile</div><div style="color:var(--text-body)">nested tiles inside cards</div></div>
<div style="background:var(--surface-brand);border-radius:var(--radius-md);padding:12px"><div style="font-weight:700;color:var(--text-on-brand)">--surface-brand</div><div style="color:rgba(255,255,255,.8)">primary action, promo</div></div>
<div style="padding:2px 12px"><span style="color:var(--text-heading);font-weight:800;font-size:14px">--text-heading</span></div>
<div style="padding:2px 12px"><span style="color:var(--text-body)">--text-body</span></div>
<div style="padding:2px 12px"><span style="color:var(--text-muted)">--text-muted</span></div>
<div style="padding:2px 12px"><span style="color:var(--text-brand);font-weight:700">--text-brand</span></div>
</div></body></html>
