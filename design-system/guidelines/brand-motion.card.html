<!-- @dsCard group="Brand" viewport="700x120" name="Motion" subtitle="120 / 180 / 280ms on cubic-bezier(.2,.8,.2,1)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--white);padding:18px;font-family:var(--font-sans)}</style></head><body>
<style>@keyframes grow{from{width:8%}to{width:92%}}</style>
<div style="display:flex;flex-direction:column;gap:9px;font-size:10px;font-family:var(--font-mono);color:var(--text-muted)">
<div>fast 120ms<div style="height:6px;border-radius:99px;background:var(--ink-100);margin-top:3px"><div style="height:100%;border-radius:99px;background:var(--green-600);animation:grow 120ms cubic-bezier(.2,.8,.2,1) infinite alternate"></div></div></div><div>base 180ms<div style="height:6px;border-radius:99px;background:var(--ink-100);margin-top:3px"><div style="height:100%;border-radius:99px;background:var(--green-600);animation:grow 180ms cubic-bezier(.2,.8,.2,1) infinite alternate"></div></div></div><div>slow 280ms<div style="height:6px;border-radius:99px;background:var(--ink-100);margin-top:3px"><div style="height:100%;border-radius:99px;background:var(--green-600);animation:grow 280ms cubic-bezier(.2,.8,.2,1) infinite alternate"></div></div></div>
</div></body></html>
