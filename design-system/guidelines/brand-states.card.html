<!-- @dsCard group="Brand" viewport="700x160" name="Interaction states" subtitle="Hover darkens one step, press scales .985, focus = 3px green ring" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--white);padding:18px;font-family:var(--font-sans)}</style></head><body>
<div style="display:flex;gap:12px;align-items:center;font-size:11px;font-weight:600;color:#fff">
<div style="height:38px;padding:0 18px;border-radius:99px;background:var(--green-600);display:flex;align-items:center">rest</div>
<div style="height:38px;padding:0 18px;border-radius:99px;background:var(--green-700);display:flex;align-items:center">hover</div>
<div style="height:38px;padding:0 18px;border-radius:99px;background:var(--green-700);transform:scale(.985);display:flex;align-items:center">press</div>
<div style="height:38px;padding:0 18px;border-radius:99px;background:var(--green-600);box-shadow:0 0 0 3px var(--focus-ring);display:flex;align-items:center">focus</div>
<div style="height:38px;padding:0 18px;border-radius:99px;background:var(--green-600);opacity:.45;display:flex;align-items:center">disabled</div>
</div>
<div style="margin-top:12px;display:flex;gap:12px;align-items:center;font-size:11px;font-weight:600;color:var(--text-strong)">
<div style="height:38px;padding:0 18px;border-radius:99px;background:var(--ink-100);display:flex;align-items:center">secondary rest</div>
<div style="height:38px;padding:0 18px;border-radius:99px;background:var(--ink-200);display:flex;align-items:center">secondary hover</div>
<div style="height:38px;padding:0 14px;border-radius:12px;background:var(--green-50);color:var(--green-600);display:flex;align-items:center">nav active</div>
</div></body></html>
