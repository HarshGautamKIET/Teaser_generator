<!-- @dsCard group="Spacing" viewport="700x130" name="Control heights" subtitle="32 / 38 / 44px, plus the 28px icon tile" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--white);padding:18px;font-family:var(--font-sans)}</style></head><body>
<div style="display:flex;align-items:center;gap:12px;font-size:11px;font-family:var(--font-mono)">
<div style="height:32px;padding:0 16px;border-radius:var(--radius-pill);background:var(--green-600);color:#fff;display:flex;align-items:center">sm 32px</div><div style="height:38px;padding:0 16px;border-radius:var(--radius-pill);background:var(--green-600);color:#fff;display:flex;align-items:center">md 38px</div><div style="height:44px;padding:0 16px;border-radius:var(--radius-pill);background:var(--green-600);color:#fff;display:flex;align-items:center">lg 44px</div>
<div style="width:var(--icon-tile);height:var(--icon-tile);border-radius:var(--radius-sm);background:var(--green-50)"></div><span style="color:var(--text-muted)">--icon-tile 28px</span>
</div></body></html>
